<!doctype html><html><head><meta charset="utf-8"><title>RoadLink Settlement Calculator</title>
<style>body{font-family:Arial,sans-serif;max-width:900px;margin:40px auto;padding:0 20px;color:#1f2937}h1{color:#16324f}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{border:1px solid #d1d5db;border-radius:10px;padding:16px}.card h3{margin-top:0}.out{background:#f3f6f8}.row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #e5e7eb}input{width:100%;padding:9px;box-sizing:border-box}button{margin-top:16px;padding:11px 18px;background:#16324f;color:white;border:0;border-radius:6px;cursor:pointer}.note{font-size:13px;color:#6b7280}</style></head>
<body><h1>RoadLink Freight — Trip Settlement Calculator</h1><p class="note">Confirmed exercise rules. GST excluded. Final amounts rounded to nearest rupee.</p>
<div class="grid"><div class="card"><h3>Inputs</h3><label>Booked weight (t)<input id="b" value="20"></label><br><label>Actual loaded weight (t)<input id="a" value="19"></label><br><label>Rate / tonne (₹)<input id="r" value="2500"></label><br><label>Loading hours<input id="lh" value="26"></label><br><label>Unloading hours<input id="uh" value="25"></label><br><label>Shortage / damage claim (₹)<input id="c" value="0"></label><button onclick="calc()">Calculate settlement</button></div>
<div class="card out"><h3>Outputs</h3><div id="o">Enter inputs and calculate.</div></div></div>
<script>function money(x){return '₹'+Math.round(x).toLocaleString('en-IN')}function calc(){let b=+document.getElementById('b').value,a=+document.getElementById('a').value,r=+document.getElementById('r').value,lh=+document.getElementById('lh').value,uh=+document.getElementById('uh').value,c=+document.getElementById('c').value;let cw=Math.max(a,.9*b),freight=cw*r,ld=lh>24?Math.ceil((lh-24)/24)*1500:0,ud=uh>24?Math.ceil((uh-24)/24)*1500:0,det=ld+ud,inv=freight+det,comm=.06*freight,pay=freight-comm+det-c,adv=.8*b*r,bal=pay-adv;document.getElementById('o').innerHTML=[['Chargeable weight',cw.toFixed(2)+' t'],['Freight',money(freight)],['Loading detention',money(ld)],['Unloading detention',money(ud)],['Shipper invoice',money(inv)],['RoadLink commission',money(comm)],['Transporter payout',money(pay)],['Advance',money(adv)],['Balance / recovery',bal>=0?money(bal):'Recovery '+money(-bal)]].map(x=>'<div class="row"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>').join('')}</script></body></html>
